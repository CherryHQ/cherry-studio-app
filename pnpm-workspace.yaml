packages:
  - packages/*

# Never write patched or built package output into the shared store, so one checkout cannot
# contaminate others. See docs/guides/development.md#dependencies.
sideEffectsCacheReadonly: true

# Implicit pre-run installs can reapply patches during EAS prebuild and change the native
# fingerprint. See docs/guides/development.md#dependencies.
verifyDepsBeforeRun: warn

minimumReleaseAge: 1440
trustPolicy: no-downgrade

# 既有 lockfile 版本，早年发布缺 provenance 触发误报；升级后可移除对应条目
trustPolicyExclude:
  - eslint-import-resolver-typescript@3.10.1
  - react-native-chart-kit@7.0.2
  - semver@6.3.1
  - tinyexec@1.2.2
  - ua-parser-js@0.7.41||1.0.41

overrides:
  '@storybook/react': 10.5.1
  '@storybook/react-native-theming': 10.5.1
  '@storybook/react-native-ui': 10.5.1
  '@storybook/react-native-ui-common': 10.5.1
  '@valibot/to-json-schema': 1.5.0
  '@ai-sdk/anthropic': 3.0.103
  '@ai-sdk/azure': 3.0.116
  '@ai-sdk/deepseek': 2.0.57
  '@ai-sdk/google': 3.0.132
  '@ai-sdk/openai': 3.0.109
  '@ai-sdk/openai-compatible': 2.0.72
  '@ai-sdk/provider': 3.0.18
  '@ai-sdk/provider-utils': 4.0.58
  '@ai-sdk/xai': 3.0.126
  ai: 6.0.185
  expo-app-metrics: 58.0.14
  react-native-svg: 15.16.0

allowBuilds:
  esbuild: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true
  core-js: true
  '@j178/prek': true
  '@shopify/react-native-skia': true
  # Installs the Sentry CLI binary used for source-map and debug-symbol uploads.
  '@sentry/cli': true
  # 1.0.0 起把 tree-sitter 语法和 RaTeX XCFramework 挪到 postinstall 下载，
  # 不放行就装不出代码高亮和数学公式所需的原生产物。
  react-native-enriched-markdown: true
  # Downloads the published iOS AnyDoc XCFramework; Android downloads at native build time.
  react-native-anydoc: true
  # Jest's watcher ships prebuilt binaries; its install script only builds from source on request.
  '@parcel/watcher': false
  '@google/genai': false
  protobufjs: false

patchedDependencies:
  '@anthropic-ai/vertex-sdk@0.22.0': patches/@anthropic-ai__vertex-sdk@0.22.0.patch
  '@earendil-works/pi-durable@1.4.0': patches/@earendil-works__pi-durable@1.4.0.patch
  '@earendil-works/pi-codemode@1.4.0': patches/@earendil-works__pi-codemode@1.4.0.patch
  '@earendil-works/pi-ai@1.4.0': patches/@earendil-works__pi-ai@1.4.0.patch
  "@magrinj/expo-quick-look@0.3.1": patches/@magrinj__expo-quick-look@0.3.1.patch
  metro@0.87.1: patches/metro@0.87.1.patch
  metro-runtime@0.87.1: patches/metro-runtime@0.87.1.patch
  uniwind@1.6.5: patches/uniwind@1.6.5.patch
  react-native-reanimated@4.7.1: patches/react-native-reanimated@4.7.1.patch
  '@ai-sdk/google@3.0.132': patches/@ai-sdk__google@3.0.132.patch
  '@ai-sdk/openai@3.0.109': patches/@ai-sdk__openai@3.0.109.patch
  '@ai-sdk/openai-compatible@2.0.72': patches/@ai-sdk__openai-compatible@2.0.72.patch
  '@openrouter/ai-sdk-provider@2.10.0': patches/@openrouter__ai-sdk-provider@2.10.0.patch
  ai@6.0.185: patches/ai@6.0.185.patch
  react-native-keyboard-controller@1.22.9: patches/react-native-keyboard-controller@1.22.9.patch
  expo-router@58.0.26: patches/expo-router@58.0.26.patch
  react-native-enriched-markdown@1.0.1: patches/react-native-enriched-markdown@1.0.1.patch
  react-native-drawer-layout@4.2.12: patches/react-native-drawer-layout@4.2.12.patch
  expo-calendar@58.0.6: patches/expo-calendar@58.0.6.patch
  react-native-background-actions@4.1.0: patches/react-native-background-actions@4.1.0.patch
  expo-app-metrics@58.0.14: patches/expo-app-metrics@58.0.14.patch
  react-native-screens@4.30.0: patches/react-native-screens@4.30.0.patch
  react-native@0.88.0: patches/react-native@0.88.0.patch
  expo-widgets@58.0.23: patches/expo-widgets@58.0.23.patch
  react-native-streamdown@0.2.0: patches/react-native-streamdown@0.2.0.patch
  expo-observe@58.0.16: patches/expo-observe@58.0.16.patch
  react-native-anydoc@0.4.1: patches/react-native-anydoc@0.4.1.patch
  drizzle-orm@0.45.2: patches/drizzle-orm@0.45.2.patch
  expo-paste-input@0.2.2: patches/expo-paste-input@0.2.2.patch
  '@earendil-works/chord@1.4.0': patches/@earendil-works__chord@1.4.0.patch
  '@preeternal/react-native-file-hash@3.0.1': patches/@preeternal__react-native-file-hash@3.0.1.patch
  react-native-nitro-modules@0.36.4: patches/react-native-nitro-modules@0.36.4.patch
  '@google/genai@2.21.0': patches/@google__genai@2.21.0.patch
  '@react-native-masked-view/masked-view@0.3.2': patches/@react-native-masked-view__masked-view@0.3.2.patch
  nitrogen@0.36.4: patches/nitrogen@0.36.4.patch

minimumReleaseAgeExclude:
  # Pi 1.4.0 is upgraded as one release, including its internal dependencies.
  - '@earendil-works/chord@1.4.0'
  - '@earendil-works/pi-ai@1.4.0'
  - '@earendil-works/pi-durable@1.4.0'
  - '@earendil-works/pi-codemode@1.4.0'
  - '@earendil-works/pi-telemetry@1.4.0'
  - '@cherrystudio/ai-core@2.4.2'
  - '@cherrystudio/ai-sdk-provider@0.1.9'
  - '@expo/fingerprint@0.20.1'
  - '@expo/inline-modules@0.1.1'
  - react-native-enriched-markdown@1.0.1
  - '@legendapp/list@3.3.3'
  - '@cherrystudio/analytics-client@1.4.0'
