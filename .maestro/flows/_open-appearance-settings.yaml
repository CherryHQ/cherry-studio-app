appId: ${APP_ID}
name: Shared helper - open appearance settings
---
- runFlow:
    when:
      platform: iOS
      notVisible:
        id: sidebar-settings
    commands:
      # The native iOS toolbar exposes the action's accessibility label.
      - tapOn: "Open menu|打开菜单"
- runFlow:
    when:
      platform: Android
      notVisible:
        id: sidebar-settings
    commands:
      - tapOn:
          id: main-header-open-sidebar
- extendedWaitUntil:
    visible:
      id: sidebar-settings
    timeout: 10000
- tapOn:
    id: sidebar-settings
- extendedWaitUntil:
    visible:
      id: settings-general
    timeout: 10000
- tapOn:
    id: settings-general
