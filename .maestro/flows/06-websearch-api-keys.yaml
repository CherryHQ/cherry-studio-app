appId: com.cherry-ai.cherry-studio-app
tags: [settings, websearch]
---
- runFlow: ../subflows/launch.yaml
- tapOn: "^Settings$|^设置$"
- tapOn: "Web search|网络搜索"
- tapOn: "Tavily"
# 字段骨架
- assertVisible: "API Keys"
- assertVisible: "Search API host|搜索 API 地址"
# 输入两个逗号分隔的 key 并显示明文：应保持单行逗号串（历史"两行"缺陷回归点）
- tapOn: "Show API keys|显示 API Keys"
# 注意：点占位文案聚焦输入框；"API Keys" 是 section 标题，点它不会 focus
- tapOn: "Enter API keys|输入 API Keys"
- inputText: "sk-e2e-key-aaaa,sk-e2e-key-bbbb"
- hideKeyboard
- assertVisible: "sk-e2e-key-aaaa,sk-e2e-key-bbbb"
# per-key 设置屏：两行独立 key + 删除动作
- tapOn: "API Key settings|API Key 设置"
- assertVisible: "sk-e2e-key-aaaa"
- assertVisible: "sk-e2e-key-bbbb"
# 清理：逐个删除测试 key（不留脏数据）
- tapOn: "Remove API Key|移除 API Key"
- assertVisible: "Remove API key\\?|移除 API Key？"
- tapOn: "Remove|移除"
- tapOn: "Remove API Key|移除 API Key"
- tapOn: "Remove|移除"
- assertVisible: "Add API Key|添加 API Key"
- tapOn: "Back|返回"
- tapOn: "Back|返回"
- assertVisible: "API providers|API 服务商"
