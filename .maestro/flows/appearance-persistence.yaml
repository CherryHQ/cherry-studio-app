appId: ${APP_ID}
name: Appearance mode and palette persist after restart
---
- clearState
- openLink:
    link: ${DEV_CLIENT_URL}
- runFlow:
    when:
      visible: "Open|打开"
    commands:
      - tapOn: "Open|打开"
- runFlow: _skip-onboarding.yaml
- runFlow: _open-appearance-settings.yaml
- extendedWaitUntil:
    visible:
      id: theme-preview-light
    timeout: 10000
- tapOn:
    id: theme-preview-light
- tapOn:
    id: theme-palette-purple
- runFlow:
    file: _assert-appearance.yaml
    env:
      THEME_MODE: light
- takeScreenshot: theme-palette-purple-light
- tapOn:
    id: theme-preview-dark
- runFlow:
    file: _assert-appearance.yaml
    env:
      THEME_MODE: dark
- stopApp
- openLink:
    link: ${DEV_CLIENT_URL}
- extendedWaitUntil:
    visible:
      id: chat-composer
    timeout: 90000
- runFlow: _open-appearance-settings.yaml
- runFlow:
    file: _assert-appearance.yaml
    env:
      THEME_MODE: dark
- takeScreenshot: theme-palette-purple-dark
