appId: com.cherry-ai.cherry-studio-app
tags: [smoke]
---
- runFlow: ../subflows/launch.yaml
# 主页骨架：导航栏、空态文案、输入区
- assertVisible: "Open sidebar"
- assertVisible: "New chat"
- assertVisible: "What would you like to discuss?"
- assertVisible: "Choose an assistant and model, then start chatting."
- assertVisible: "Send message"
# Reasoning effort 滑杆钉在 model picker sheet 底部（分割线下方）
- tapOn:
    id: "chat-input-model-button"
- extendedWaitUntil:
    visible: "Reasoning effort"
    timeout: 5000
- assertVisible: "Search"
# 点 scrim 关闭 sheet 回到主页（sheet 中部是模型列表，下滑只会滚动列表）
- tapOn:
    point: 50%,10%
- waitForAnimationToEnd
- assertVisible: "What would you like to discuss?"
