appId: com.cherry-ai.cherry-studio-app
tags: [smoke]
---
- runFlow: ../subflows/launch.yaml
# 消息 tab 骨架与新建入口
- assertVisible: "^Edit$|^编辑$"
- assertVisible: "^Conversations$|^对话$"
- assertVisible: "^Drawings$|^绘图$"
- tapOn: "^New$|^新建$"
- tapOn: "^New chat$|^新建聊天$"
# 新会话骨架：空态文案与输入区
- assertVisible: "What would you like to discuss\\?|今天想聊什么？"
- assertVisible: "Choose an assistant and model, then start chatting\\.|选择助手和模型后开始对话。"
- assertVisible: "Send message|发送消息"
# 未配置默认模型时从输入区打开 model picker
- tapOn: "Select model|选择模型"
- extendedWaitUntil:
    visible: "Search|搜索"
    timeout: 5000
- assertVisible: "Search|搜索"
# 点 scrim 关闭 sheet 回到主页（sheet 中部是模型列表，下滑只会滚动列表）
- tapOn:
    point: 50%,10%
- waitForAnimationToEnd
- assertVisible: "What would you like to discuss\\?|今天想聊什么？"
