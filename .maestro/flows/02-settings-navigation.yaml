appId: com.cherry-ai.cherry-studio-app
tags: [settings]
---
- runFlow: ../subflows/launch.yaml
- tapOn: "Open sidebar"
- tapOn: "Settings"
# 设置根屏分组
- assertVisible: "Edit profile"
- assertVisible: "Model service"
- assertVisible: "Default model"
- assertVisible: "Web search"
- assertVisible: "Data backup"
- assertVisible: "About us"
# Model service 列表
- tapOn: "Model service"
- assertVisible: "Add Provider"
- assertVisible: "CherryInExpress"
- assertVisible: "Disabled model services.*"
# 注意：Maestro 的 back 是 Android-only（iOS 上静默 no-op），必须点 header 返回键
- tapOn: "Back"
# Web search 列表
- tapOn: "Web search"
- assertVisible: "General settings"
- assertVisible: "API providers"
- assertVisible: "Tavily"
- tapOn: "Back"
# 关闭设置：回到侧栏（设置由侧栏进入，Close 只退一层）。
# 不再点侧栏的 New chat 回主页——该按钮在「当前已是空白新会话」时隐藏，
# 显隐随会话状态变化，不是确定性锚点
- tapOn: "Close"
- assertVisible: "Recents"
