appId: com.cherry-ai.cherry-studio-app
tags: [settings]
---
- runFlow: ../subflows/launch.yaml
- tapOn: "^Settings$|^设置$"
# 设置根屏分组
- assertVisible: "^Profile$|^个人资料$"
- assertVisible: "Model service|模型服务"
- assertVisible: "Default model|默认模型"
- assertVisible: "Web search|网络搜索"
- assertVisible: "Data backup|数据备份"
- assertVisible: "About us|关于我们"
# Model service 列表
- tapOn: "Model service|模型服务"
- assertVisible: "Add Provider|新建服务商"
- assertVisible: "^CherryIN$"
# 注意：Maestro 的 back 是 Android-only（iOS 上静默 no-op），必须点 header 返回键
- tapOn: "Back|返回"
# Web search 列表
- tapOn: "Web search|网络搜索"
- assertVisible: "General settings|常规设置"
- assertVisible: "API providers|API 服务商"
- assertVisible: "Tavily"
- tapOn: "Back|返回"
# 返回后仍停留在设置 tab 根屏
- assertVisible: "^Profile$|^个人资料$"
- assertVisible: "Model service|模型服务"
