appId: ${APP_ID}
name: Fresh install skips onboarding
---
- clearState
- openLink:
    link: ${DEV_CLIENT_URL}
- runFlow:
    when:
      visible: "Open|打开"
    commands:
      - tapOn: "Open|打开"
- extendedWaitUntil:
    visible:
      id: onboarding-welcome
    timeout: 30000
- tapOn:
    id: onboarding-skip
- extendedWaitUntil:
    visible:
      id: chat-composer
    timeout: 30000
- assertVisible:
    id: chat-composer-input
