appId: com.cherry-ai.cherry-studio-app
tags: [settings, provider, legend-list]
---
- runFlow: ../subflows/launch.yaml
- tapOn: "^Settings$|^设置$"
- tapOn: "Model service|模型服务"
- tapOn: "^CherryIN$"
# 等 provider 详情加载完成后再操作模型工具栏
- extendedWaitUntil:
    visible: "Base URL"
    timeout: 10000
- waitForAnimationToEnd
- tapOn: "Models|模型"
- tapOn: "Pull models|拉取模型"
# CherryIN 没有测试密钥；验证 pull workflow 的错误/空结果反馈且页面保持可用。
- extendedWaitUntil:
    visible: "Failed to pull models|拉取模型失败|Pull timed out\\. Try again later\\.|拉取模型超时，请稍后重试|Model list is up to date|模型列表已是最新"
    timeout: 30000
- assertVisible: "Models|模型"
