appId: com.cherry-ai.cherry-studio-app
tags: [chat, legend-list]
---
- runFlow: ../subflows/launch.yaml
# 打开侧栏：固定入口 + 话题列表
- tapOn: "Open sidebar"
- assertVisible: "Search"
- assertVisible: "Settings"
- assertVisible: "Assistants"
- assertVisible: "Recents"
# 打开 100 条复杂消息的 benchmark 话题（LegendList 压力面）
- tapOn: "Benchmark Complex 100"
- assertVisible: "Topic actions"
# 初始定位在列表底部：最后一条消息（message 100）的末尾 Trace 行可见
# （不能断言消息标题——最后一条消息很长，钉底时标题在屏幕上缘被裁）
- assertVisible: "Trace: mock-benchmark-topic-complex-100:100"
# 快速滚动往返，不应白屏/丢内容
# 目标用消息末尾 Trace 行（一行高）：消息很长（每条 ~2-3 屏），heading 在
# 消息顶部太远；速度用默认值——高速滑动会在两次可见性检查之间整屏跳过
# 单行目标（speed 80 实测滚过头到 message 85）
- scrollUntilVisible:
    element: "Trace: mock-benchmark-topic-complex-100:98"
    direction: UP
    timeout: 60000
- scroll
- scroll
# 返回主页
- tapOn: "Open sidebar"
- tapOn: "New chat"
- assertVisible: "What would you like to discuss?"
