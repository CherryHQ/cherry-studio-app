appId: com.cherry-ai.cherry-studio-app
tags: [chat, gesture]
---
- runFlow: ../subflows/launch.yaml
# 从消息 tab 的 header 菜单进入新会话
- tapOn: "^New$|^新建$"
- tapOn: "^New chat$|^新建聊天$"
# 打开 ＋ 内联面板（不再是 sheet，所以没有标题可断言）
- tapOn: "Attach|添加附件"
- assertVisible: "Camera|相机"
- assertVisible: "Photos|照片"
- assertVisible: "File|文件"
# 照片网格（首次可能弹系统相册权限）
- tapOn: "Photos|照片"
- tapOn:
    text: "Allow Access to All Photos|Allow Full Access|允许完全访问"
    optional: true
- extendedWaitUntil:
    visible: "Photo preview|照片预览"
    timeout: 10000
# 选择一张：底部出现确认按钮（Gesture.Tap 驱动的 UI 线程按压路径）
- tapOn: "Photo preview|照片预览"
- assertVisible: "Add \\d+ photos|添加 ?\\d+ ?张照片"
# 再点取消选择：确认按钮消失
- tapOn: "Photo preview|照片预览"
- assertNotVisible: "Add \\d+ photos|添加 ?\\d+ ?张照片"
