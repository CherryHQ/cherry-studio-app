appId: com.cherry-ai.cherry-studio-app
tags: [chat, gesture]
---
- runFlow: ../subflows/launch.yaml
# 打开 Add to Chat sheet
- tapOn: "Add"
- assertVisible: "Add to Chat"
- assertVisible: "Camera"
- assertVisible: "Photos"
- assertVisible: "File"
# 照片网格（首次可能弹系统相册权限）
- tapOn: "Photos"
- tapOn:
    text: "Allow Access to All Photos"
    optional: true
- extendedWaitUntil:
    visible: "Photo preview"
    timeout: 10000
# 选择一张：底部出现确认按钮（Gesture.Tap 驱动的 UI 线程按压路径）
- tapOn: "Photo preview"
- assertVisible: "Add \\d+ photos"
# 再点取消选择：确认按钮消失
- tapOn: "Photo preview"
- assertNotVisible: "Add \\d+ photos"
