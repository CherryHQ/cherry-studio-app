plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'expo.modules.appupdate'
version = '1.0.0'
android {
  namespace 'expo.modules.appupdate'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    consumerProguardFiles "proguard-rules.pro"
  }
}
dependencies {
  implementation 'com.google.android.play:app-update:2.1.0'
  implementation(name: 'appmarket-updater-open-16.0.18.301', ext: 'aar')
  implementation(name: 'xiaomi-update-sdk-4.2.4', ext: 'aar')
}
