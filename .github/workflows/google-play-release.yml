name: Google Play AAB

on:
  workflow_call:

permissions:
  contents: read

env:
  EAS_CLI_VERSION: 24.4.2

jobs:
  build-android:
    name: Build Google Play AAB locally
    runs-on: [self-hosted, macOS, ARM64, release]
    environment: local-release
    concurrency:
      group: cherry-studio-app-android-local-build
      cancel-in-progress: false
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Verify runner toolchain
        run: |
          node -p 'process.version' | grep -Eq '^v24\.'
          test "$(pnpm -v)" = "12.2.1"
          command -v bundletool > /dev/null
          command -v jarsigner > /dev/null

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and archive Google Play AAB locally
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          CHERRY_CLOUD_CLIENT_SECRET: ${{ secrets.CHERRY_CLOUD_CLIENT_SECRET }}
          CHERRYAI_CLIENT_SECRET: ${{ secrets.CHERRYAI_CLIENT_SECRET }}
          CONFIG_SERVICE_ORIGIN: ${{ secrets.CONFIG_SERVICE_ORIGIN }}
          EXPO_PUBLIC_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GITHUB_OAUTH_CLIENT_ID }}
          EXPO_PUBLIC_GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.EXPO_PUBLIC_GITHUB_OAUTH_CLIENT_SECRET }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --import tsx scripts/releaseLocalBuild.ts build \
            --target android-google-play \
            --tag "$RELEASE_TAG" \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Explain manual Google Play upload
        env:
          ARCHIVE_DIR: ${{ steps.build.outputs.archive_dir }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          Signed Google Play AAB and \`SHA256SUMS\` are archived on the build machine at:
          \`$ARCHIVE_DIR\`

          Upload the \`.aab\` file to your chosen release track in Google Play Console, then complete the release and submit it for review there.
          This workflow does not retain GitHub Actions artifacts, upload to Google Play, or submit for review.
          EOF
