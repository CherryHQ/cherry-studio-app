name: Pull Request CI

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches:
      - main
    types: [ready_for_review, synchronize, opened, reopened]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PRCI: true
    if: github.event.pull_request.draft == false

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.2.1

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  typecheck:
    runs-on: ubuntu-latest
    env:
      PRCI: true
    if: github.event.pull_request.draft == false

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.2.1

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Type Check
        run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    env:
      PRCI: true
    if: github.event.pull_request.draft == false

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.2.1

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        env:
          SHELLCHECK_OPTS: --severity=error
        with:
          args: -color

      - name: Lint Check
        run: pnpm lint

      - name: Translation Check
        run: pnpm i18n:check

      - name: UI Boundary Check
        run: pnpm ui:check-boundaries

      - name: AI Runtime Boundary Check
        run: pnpm --filter @cherrystudio/ai-runtime check:boundaries

      - name: Design Contract Check
        run: pnpm design:check

      - name: Format Check
        run: pnpm format:check

      - name: Documentation Link Check
        run: pnpm docs:check-links

      - name: Skill Check
        run: pnpm skills:check

  ci:
    name: CI
    needs: [test, typecheck, lint]
    if: always() && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to succeed
        run: test "${{ needs.test.result }}${{ needs.typecheck.result }}${{ needs.lint.result }}" = successsuccesssuccess
