name: Android Release

on:
  workflow_call:
    inputs:
      domestic:
        description: Build the APK for domestic stores without publishing to GitHub
        type: boolean
        default: false

# release.yml grants write access only to the public GitHub release call.
env:
  EAS_CLI_VERSION: 24.4.2
  RELEASE_TARGET: ${{ inputs.domestic && 'android-domestic-stores' || 'android-public' }}

jobs:
  build-android:
    name: Build Android APK locally
    runs-on: [self-hosted, macOS, ARM64, release]
    environment: local-release
    concurrency:
      group: cherry-studio-app-android-local-build
      cancel-in-progress: false
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Verify runner toolchain
        env:
          BUILD_DOMESTIC: ${{ inputs.domestic }}
        run: |
          node -p 'process.version' | grep -Eq '^v24\.'
          test "$(pnpm -v)" = "12.2.1"
          command -v jq > /dev/null
          command -v apksigner > /dev/null
          command -v aapt2 > /dev/null
          if [[ "$BUILD_DOMESTIC" != true ]]; then
            command -v gh > /dev/null
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and archive Android locally
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          CHERRY_CLOUD_CLIENT_SECRET: ${{ secrets.CHERRY_CLOUD_CLIENT_SECRET }}
          CHERRYAI_CLIENT_SECRET: ${{ secrets.CHERRYAI_CLIENT_SECRET }}
          CONFIG_SERVICE_ORIGIN: ${{ secrets.CONFIG_SERVICE_ORIGIN }}
          EXPO_PUBLIC_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GITHUB_OAUTH_CLIENT_ID }}
          EXPO_PUBLIC_GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.EXPO_PUBLIC_GITHUB_OAUTH_CLIENT_SECRET }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --import tsx scripts/releaseLocalBuild.ts build \
            --target "$RELEASE_TARGET" \
            --tag "$RELEASE_TAG" \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Publish release with APK and checksums
        if: ${{ !inputs.domestic }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          ARCHIVE_DIR: ${{ steps.build.outputs.archive_dir }}
          ARTIFACT_NAME: ${{ steps.build.outputs.artifact_name }}
          NATIVE_BUILD_VERSION: ${{ steps.build.outputs.native_build_version }}
          LOCAL_BUILD_ID: ${{ steps.build.outputs.build_id }}
        run: |
          cd "$ARCHIVE_DIR"
          shasum -a 256 -c SHA256SUMS
          gh api --method POST "repos/$GH_REPO/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" -f target_commitish="$GITHUB_SHA" \
            --jq .body > release-notes.md
          cat >> release-notes.md <<EOF

          ## Installation

          - Android: download the attached APK (ARM64) and install it on your device.
          - Google Play and iOS App Store availability depend on their independent uploads, review, and publication. This GitHub release does not publish either store listing.
          - SHA-256 checksums are included in SHA256SUMS.

          Source: $GITHUB_SHA
          Local build ID: $LOCAL_BUILD_ID
          Native versionCode: $NATIVE_BUILD_VERSION
          EOF
          prerelease=false
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=true; fi
          if ! gh release view "$RELEASE_TAG" --json id > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TAG" --notes-file release-notes.md --prerelease="$prerelease"
          fi
          gh release view "$RELEASE_TAG" --json assets > "$RUNNER_TEMP/github-release.json"
          mkdir -p "$RUNNER_TEMP/existing-assets"
          for asset in SHA256SUMS "$ARTIFACT_NAME"; do
            if jq -e --arg name "$asset" '.assets[] | select(.name == $name)' "$RUNNER_TEMP/github-release.json" > /dev/null; then
              gh release download "$RELEASE_TAG" --pattern "$asset" --dir "$RUNNER_TEMP/existing-assets"
              cmp "$asset" "$RUNNER_TEMP/existing-assets/$asset"
            else
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          done
          rm -rf "$RUNNER_TEMP/existing-assets" "$RUNNER_TEMP/github-release.json"
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease"
          echo "GitHub Release: https://github.com/$GH_REPO/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize domestic stores archive
        if: ${{ inputs.domestic }}
        env:
          ARCHIVE_DIR: ${{ steps.build.outputs.archive_dir }}
        run: |
          {
            echo "Archived domestic stores APK locally at: \`$ARCHIVE_DIR\`"
            echo "Submit the same APK separately to HONOR, Xiaomi, OPPO and vivo."
          } >> "$GITHUB_STEP_SUMMARY"
