name: Android Release

on:
  workflow_call:
    inputs:
      domestic:
        description: Build the APK for domestic stores without publishing to GitHub
        type: boolean
        default: false
    secrets:
      EXPO_TOKEN:
        required: true

# release.yml grants write access only to the public GitHub release call.
env:
  EAS_CLI_VERSION: 24.4.2
  ANDROID_BUILD_PROFILE: ${{ inputs.domestic && 'production-domestic-stores' || 'production' }}
  RELEASE_ARTIFACT_NAME: ${{ inputs.domestic && 'domestic-stores-release' || 'android-release' }}

jobs:
  build-android:
    name: Build Android APK on EAS
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.2.1

      - name: Configure EAS CLI install scripts
        # Match expo-github-action's temporary CLI directory; allowBuilds is project-only.
        run: |
          eas_cli_dir="$RUNNER_TEMP/eas-cli/$EAS_CLI_VERSION/$(node -p 'require("node:os").arch()')"
          mkdir -p "$eas_cli_dir"
          pnpm --dir "$eas_cli_dir" config set --location=project --json allowBuilds '{"dtrace-provider": false, "protobufjs": false}'

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: ${{ env.EAS_CLI_VERSION }}
          token: ${{ secrets.EXPO_TOKEN }}
          packager: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Android on EAS and wait for completion
        run: eas build --platform android --profile "$ANDROID_BUILD_PROFILE" --non-interactive --wait --json > "$RUNNER_TEMP/android-build.json"

      - name: Download APK and prepare release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_DOMESTIC: ${{ inputs.domestic }}
        run: |
          build_json="$RUNNER_TEMP/android-build.json"
          jq -e 'length == 1 and .[0].status == "FINISHED" and .[0].platform == "ANDROID"' "$build_json"
          build_id="$(jq -er '.[0].id' "$build_json")"
          apk_url="$(jq -er '.[0].artifacts.applicationArchiveUrl' "$build_json")"
          version="${RELEASE_TAG#v}"
          artifact_dir="$RUNNER_TEMP/$RELEASE_ARTIFACT_NAME"
          mkdir -p "$artifact_dir"
          apk_name="cherry-studio-${version}-android.apk"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 900 \
            "$apk_url" --output "$artifact_dir/$apk_name"
          unzip -tq "$artifact_dir/$apk_name"
          unzip -Z1 "$artifact_dir/$apk_name" | grep -x 'AndroidManifest.xml'
          (cd "$artifact_dir" && sha256sum "$apk_name" > SHA256SUMS)
          echo "Android EAS build: $build_id" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$BUILD_DOMESTIC" == true ]]; then
            build_tools="$(printf '%s\n' "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
            "$build_tools/apksigner" verify --print-certs "$artifact_dir/$apk_name" > "$RUNNER_TEMP/android-signing.txt"
            certificate="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/android-signing.txt")"
            test -n "$certificate"
            "$build_tools/aapt" dump badging "$artifact_dir/$apk_name" > "$RUNNER_TEMP/android-package.txt"
            package_name="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" "$RUNNER_TEMP/android-package.txt")"
            version_code="$(sed -n "s/^package:.* versionCode='\([^']*\)'.*/\1/p" "$RUNNER_TEMP/android-package.txt")"
            test "$package_name" = "$(jq -r '.expo.android.package' app.json)"
            test "$version_code" = "$(jq -r '.[0].appBuildVersion' "$build_json")"
            jq --arg commit "$GITHUB_SHA" --arg certificate "$certificate" --arg package "$package_name" \
              '.[0] | {buildId: .id, commit: $commit, packageName: $package, appVersion, versionCode: .appBuildVersion, channel: "production-domestic-stores", signingCertificateSha256: $certificate}' \
              "$build_json" > "$artifact_dir/release-manifest.json"
            cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          Download `domestic-stores-release` for the APK, `SHA256SUMS` and `release-manifest.json`.
          Submit the same APK separately to HONOR, Xiaomi, OPPO and vivo. Each store owns its review
          and publication; this build does not upload to stores or publish the APK on GitHub.
          EOF
            exit 0
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" -f target_commitish="$GITHUB_SHA" \
            --jq .body > "$artifact_dir/release-notes.md"
          cat >> "$artifact_dir/release-notes.md" <<EOF

          ## Installation

          - Android: download the attached APK (ARM64) and install it on your device.
          - Google Play and iOS App Store availability depend on their independent uploads, review, and publication. This GitHub release does not publish either store listing.
          - SHA-256 checksums are included in SHA256SUMS.

          Source: $GITHUB_SHA
          Android EAS build: $build_id
          EOF

      - name: Save APK for independent publishing retries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/${{ env.RELEASE_ARTIFACT_NAME }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          # A deliberate build-job rerun replaces its saved bundle; publishing-only retries reuse it.
          overwrite: true

  publish-github:
    name: Publish APK to GitHub
    if: ${{ !inputs.domestic }}
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release

      - name: Publish release with APK and checksums
        working-directory: release
        run: |
          sha256sum --check SHA256SUMS
          prerelease=false
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=true; fi
          if ! gh release view "$RELEASE_TAG" --json id > /dev/null; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TAG" --notes-file release-notes.md --prerelease="$prerelease"
          fi
          gh release view "$RELEASE_TAG" --json assets > "$RUNNER_TEMP/github-release.json"
          mkdir -p "$RUNNER_TEMP/existing-assets"
          for asset in SHA256SUMS *.apk; do
            if jq -e --arg name "$asset" '.assets[] | select(.name == $name)' "$RUNNER_TEMP/github-release.json" > /dev/null; then
              gh release download "$RELEASE_TAG" --pattern "$asset" --dir "$RUNNER_TEMP/existing-assets"
              cmp "$asset" "$RUNNER_TEMP/existing-assets/$asset"
            else
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          done
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease"
          echo "GitHub Release: https://github.com/$GH_REPO/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
