name: iOS TestFlight

on:
  workflow_call:
    secrets:
      EXPO_TOKEN:
        required: true

permissions:
  contents: read

env:
  EAS_CLI_VERSION: 24.4.2

jobs:
  build-ios:
    name: Build iOS on EAS
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      build_id: ${{ steps.build.outputs.build_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.2.1

      - name: Configure EAS CLI install scripts
        # Match expo-github-action's temporary CLI directory; allowBuilds is project-only.
        run: |
          eas_cli_dir="$RUNNER_TEMP/eas-cli/$EAS_CLI_VERSION/$(node -p 'require("node:os").arch()')"
          mkdir -p "$eas_cli_dir"
          pnpm --dir "$eas_cli_dir" config set --location=project --json allowBuilds '{"dtrace-provider": false, "protobufjs": false}'

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: ${{ env.EAS_CLI_VERSION }}
          token: ${{ secrets.EXPO_TOKEN }}
          packager: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.side-effects-cache-readonly=false

      - name: Build iOS on EAS and wait for completion
        id: build
        run: |
          eas build --platform ios --profile production --non-interactive --wait --json > "$RUNNER_TEMP/ios-build.json"
          jq -e 'length == 1 and .[0].status == "FINISHED" and .[0].platform == "IOS"' "$RUNNER_TEMP/ios-build.json"
          build_id="$(jq -er '.[0].id' "$RUNNER_TEMP/ios-build.json")"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          echo "iOS EAS build: $build_id" >> "$GITHUB_STEP_SUMMARY"

  submit-ios:
    name: Upload iOS to TestFlight
    needs: build-ios
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.2.1

      - name: Configure EAS CLI install scripts
        # Match expo-github-action's temporary CLI directory; allowBuilds is project-only.
        run: |
          eas_cli_dir="$RUNNER_TEMP/eas-cli/$EAS_CLI_VERSION/$(node -p 'require("node:os").arch()')"
          mkdir -p "$eas_cli_dir"
          pnpm --dir "$eas_cli_dir" config set --location=project --json allowBuilds '{"dtrace-provider": false, "protobufjs": false}'

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: ${{ env.EAS_CLI_VERSION }}
          token: ${{ secrets.EXPO_TOKEN }}
          packager: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.side-effects-cache-readonly=false

      - name: Submit this build and wait for upload
        env:
          IOS_BUILD_ID: ${{ needs.build-ios.outputs.build_id }}
          PROFILE: production
        run: |
          eas submit --platform ios --profile production --id "$IOS_BUILD_ID" \
            --non-interactive --wait --no-auto-testflight-setup
          echo "Uploaded iOS build $IOS_BUILD_ID to App Store Connect. Apple processing and TestFlight tester configuration remain in App Store Connect." >> "$GITHUB_STEP_SUMMARY"
