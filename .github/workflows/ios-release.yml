name: iOS TestFlight

on:
  workflow_call:

permissions:
  contents: read

env:
  EAS_CLI_VERSION: 24.4.2

jobs:
  release-ios:
    name: Build and upload iOS to TestFlight
    runs-on: [self-hosted, macOS, ARM64, release]
    environment: local-release
    concurrency:
      group: cherry-studio-app-ios-local-build
      cancel-in-progress: false
    timeout-minutes: 210

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Verify runner toolchain
        run: |
          node -p 'process.version' | grep -Eq '^v24\.'
          test "$(pnpm -v)" = "12.2.1"
          command -v jq > /dev/null
          command -v plutil > /dev/null
          command -v xcodebuild > /dev/null
          command -v pod > /dev/null
          command -v fastlane > /dev/null

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reuse complete local iOS build if already archived
        id: reuse
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --import tsx scripts/releaseLocalBuild.ts find-complete \
            --target ios-production \
            --tag "$RELEASE_TAG" \
            --commit "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Build and archive iOS locally
        id: build
        if: ${{ steps.reuse.outputs.found != 'true' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          CHERRY_CLOUD_CLIENT_SECRET: ${{ secrets.CHERRY_CLOUD_CLIENT_SECRET }}
          CHERRYAI_CLIENT_SECRET: ${{ secrets.CHERRYAI_CLIENT_SECRET }}
          CONFIG_SERVICE_ORIGIN: ${{ secrets.CONFIG_SERVICE_ORIGIN }}
          EXPO_PUBLIC_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GITHUB_OAUTH_CLIENT_ID }}
          EXPO_PUBLIC_GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.EXPO_PUBLIC_GITHUB_OAUTH_CLIENT_SECRET }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --import tsx scripts/releaseLocalBuild.ts build \
            --target ios-production \
            --tag "$RELEASE_TAG" \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Verify local iOS symbols
        env:
          IOS_SYMBOLS_DIR: ${{ steps.reuse.outputs.found == 'true' && steps.reuse.outputs.symbols_dir || steps.build.outputs.symbols_dir }}
          IOS_BUILD_ID: ${{ steps.reuse.outputs.found == 'true' && steps.reuse.outputs.build_id || steps.build.outputs.build_id }}
        run: |
          node --import tsx scripts/verifyIosSymbolPackage.ts "$IOS_SYMBOLS_DIR" "$IOS_BUILD_ID" > "$RUNNER_TEMP/ios-symbol-verification.json"
          echo '### iOS debug symbols' >> "$GITHUB_STEP_SUMMARY"
          jq -r '"Verified Cherry slices: \(.slices)", "Third-party symbol coverage:", (.thirdPartySymbols[] | "    " + tojson)' \
            "$RUNNER_TEMP/ios-symbol-verification.json" >> "$GITHUB_STEP_SUMMARY"
          if jq -e 'any(.thirdPartySymbols[]; .coverage != "debug-present" or .upload != "submitted")' "$RUNNER_TEMP/ios-symbol-verification.json" > /dev/null; then
            echo "::warning::Some third-party iOS symbols have incomplete coverage or upload. See the job summary."
          fi

      - name: Submit this build and wait for upload
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          IOS_BUILD_ID: ${{ steps.reuse.outputs.found == 'true' && steps.reuse.outputs.build_id || steps.build.outputs.build_id }}
          IOS_ARCHIVE_DIR: ${{ steps.reuse.outputs.found == 'true' && steps.reuse.outputs.archive_dir || steps.build.outputs.archive_dir }}
          IOS_IPA_PATH: ${{ steps.reuse.outputs.found == 'true' && steps.reuse.outputs.artifact_path || steps.build.outputs.artifact_path }}
          PROFILE: production
        run: |
          if pnpm exec eas submit --platform ios --profile production --path "$IOS_IPA_PATH" \
            --non-interactive --wait --no-auto-testflight-setup; then
            node --import tsx scripts/releaseLocalBuild.ts record-submit \
              --build-dir "$IOS_ARCHIVE_DIR" \
              --build-id "$IOS_BUILD_ID" \
              --status succeeded
            echo "Uploaded iOS build $IOS_BUILD_ID from $IOS_IPA_PATH to App Store Connect. Apple processing and TestFlight tester configuration remain in App Store Connect." >> "$GITHUB_STEP_SUMMARY"
          else
            node --import tsx scripts/releaseLocalBuild.ts record-submit \
              --build-dir "$IOS_ARCHIVE_DIR" \
              --build-id "$IOS_BUILD_ID" \
              --status failed \
              --message "eas submit exited nonzero" || true
            exit 1
          fi
