# Cherry Studio (mobile) Maestro e2e workspace.
#
# These flows target a development build: __DEV__ seeding
# (src/data/db/seeding) guarantees the "Benchmark ..." / "Showcase ..."
# fixture topics and a preset AI provider exist, which the flows assert on.
# They will not pass against a release build with a clean database.
#
# Run all flows:
#   maestro test tests/e2e -e MAESTRO_APP_ID=com.cherry-ai.cherry-studio-app   # iOS
#   maestro test tests/e2e -e MAESTRO_APP_ID=com.cherry_ai.cherry_studio_app   # Android
#
# Run a single flow:
#   maestro test tests/e2e/smoke-launch.yaml -e MAESTRO_APP_ID=com.cherry-ai.cherry-studio-app
flows:
  - "*.yaml"
